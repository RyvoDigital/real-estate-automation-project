# Ryvo engine stack: Caddy (TLS) -> n8n -> Postgres
# Bring up from infra/:  docker compose --env-file ../.env up -d
#
# Image tags verified against current stable releases on 2026-07-01:
#   n8n 2.28.3 | postgres 18 | caddy 2.11
# Re-verify and bump deliberately; do not float on `latest` in production.

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.28.3
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      # n8n sits behind Caddy; trust the single proxy hop for correct client IPs.
      - N8N_PROXY_HOPS=1
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      - GENERIC_TIMEZONE=Europe/Lisbon
      - N8N_DIAGNOSTICS_ENABLED=false
      # --- Twilio inbound webhook signature verification (Phase 1) ---
      # Verifying X-Twilio-Signature needs HMAC-SHA1 over the request, which
      # means two n8n defaults have to be relaxed. Both were measured, not
      # assumed, against this exact image:
      #   * require('crypto') in a Code node -> "Module 'crypto' is disallowed"
      #   * $env in a Code node              -> "access to env vars denied"
      #
      # TRADE-OFF, accepted deliberately: N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # lets ANY Code node read EVERY variable below -- including
      # N8N_ENCRYPTION_KEY, DB_POSTGRESDB_PASSWORD and the JWT secret. That is
      # tolerable only because the operator is the sole workflow author.
      #
      # Consequently this env block is a security surface: anything added here
      # becomes readable from any Code node. Keep it minimal. In particular the
      # Supabase service_role key is deliberately NOT here -- it lives in an
      # n8n credential, which is encrypted at rest and, unlike a node
      # parameter, is never written into workflow JSON by
      # `n8n export:workflow` (and so never reaches git via backup.sh).
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5678"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${N8N_DB_NAME}
      - POSTGRES_USER=${N8N_DB_USER}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and expect
      # the mount at /var/lib/postgresql (NOT the old .../data path, which the
      # entrypoint now rejects). See docker-library/postgres#37.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  postgres_data:
