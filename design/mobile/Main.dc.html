<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #08080A; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C4BDB8; text-decoration: none; } a:hover { color: #F2F0EE; }
    * { box-sizing: border-box; min-width: 0; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: radial-gradient(420px 300px at 78% -6%, rgba(232,69,60,0.20), transparent 62%), #08080A; color: #F2F0EE; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 58px 20px 0 20px; flex-grow: 1; overflow: hidden;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6863;">Waiting on you</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.1; color: #FFFFFF;">Escalations</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 15px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C4BDB8" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 26px; overflow: hidden; background: linear-gradient(160deg, #2A1210 0%, #14090A 62%); border: 1px solid rgba(255,84,71,0.30); box-shadow: 0 20px 46px rgba(0,0,0,0.62);">
      <span style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #FF4438, #7A1A16);"></span>

      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #FF7A70;">Longest waiting</span>
          <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; line-height: 0.95; color: #FF5347;">4h 12m</span>
        </div>
        <span style="display: flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 999px; background: rgba(237,228,220,0.14); border: 1px solid rgba(237,228,220,0.44); font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #EDE4DC; white-space: nowrap; flex-shrink: 0;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#EDE4DC" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.6 15 9l6.4.6-4.8 4.3 1.4 6.3L12 17l-6 3.2 1.4-6.3L2.6 9.6 9 9z"></path></svg>
          High value
        </span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #FFFFFF;">Sofia Marques</span>
        <span style="font-size: 13px; color: #A8A29C;">Atlântica Prime &middot; €3.2M against a €1.5M threshold</span>
      </div>

      <div style="padding: 13px 14px; border-radius: 16px; background: rgba(0,0,0,0.34);">
        <span style="font-size: 13.5px; line-height: 1.5; color: #C4BDB8;">Qual é o valor final e há margem para negociação?</span>
      </div>

      <div style="display: flex; gap: 9px;">
        <button style="flex-grow: 1; height: 50px; border: none; border-radius: 16px; background: #EDE4DC; color: #0B0B0C; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">Reply</button>
        <button style="width: 50px; height: 50px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #C4BDB8; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"></path><path d="M3 20v-5h5"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6863;">Behind it</span>
      <span style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.07);"></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55504B;">4</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 13px; padding: 14px 15px; border-radius: 20px; background: {{row.bg}}; border: 1px solid {{row.border}};">
          <span style="width: 4px; align-self: stretch; border-radius: 4px; background: {{row.spine}}; flex-shrink: 0;"></span>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 15px; font-weight: 600; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{row.name}}</span>
            <span style="font-size: 12.5px; color: {{row.tone}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{row.why}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: {{row.tone}};">{{row.age}}</span>
            <span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 8px; background: {{row.chipBg}}; border: 1px solid {{row.chipBorder}};">
              <sc-if value="{{row.isSystem}}" hint-placeholder-val="{{true}}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{row.chipInk}}" stroke-width="2.4" stroke-linejoin="round"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
              </sc-if>
              <sc-if value="{{row.isPerson}}" hint-placeholder-val="{{false}}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{row.chipInk}}" stroke-width="2.2" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
              </sc-if>
            </span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: stretch; gap: 4px; padding: 10px 14px 30px 14px; background: rgba(8,8,10,0.92); border-top: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px; border-radius: 18px; background: linear-gradient(140deg, rgba(232,69,60,0.26), rgba(122,26,22,0.20)); border: 1px solid rgba(232,69,60,0.42);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #FF7A70;">Queue</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Leads</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Report</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">More</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Henrik Nilsson', why: 'Asked for a person — financing', age: '1h 48m',
          bg: '#171110', border: 'rgba(224,102,90,0.30)', spine: '#B33A32', tone: '#E0665A',
          chipBg: 'rgba(255,255,255,0.05)', chipBorder: 'rgba(255,255,255,0.15)', chipInk: '#A8A29C',
          isSystem: false, isPerson: true },
        { name: 'Ana Ribeiro', why: 'Voice note — nothing to read', age: '52m',
          bg: '#111011', border: 'rgba(176,130,121,0.26)', spine: '#7A4A44', tone: '#B08279',
          chipBg: 'rgba(255,84,71,0.14)', chipBorder: 'rgba(255,84,71,0.42)', chipInk: '#FF8078',
          isSystem: true, isPerson: false },
        { name: 'Tomás Cardoso', why: 'Booking failed — burned id', age: '27m',
          bg: '#0E0F12', border: 'rgba(255,255,255,0.07)', spine: '#3A3532', tone: '#8E8480',
          chipBg: 'rgba(255,84,71,0.14)', chipBorder: 'rgba(255,84,71,0.42)', chipInk: '#FF8078',
          isSystem: true, isPerson: false },
      ],
    }
  }
}
</script>
</body>
</html>
