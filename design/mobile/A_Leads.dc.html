<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #08080A; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C4BDB8; text-decoration: none; } a:hover { color: #F2F0EE; }
    * { box-sizing: border-box; min-width: 0; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: radial-gradient(420px 300px at 20% -6%, rgba(232,69,60,0.14), transparent 62%), #08080A; color: #F2F0EE; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 58px 20px 0 20px; flex-grow: 1; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6863;">2 across 2 clients</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.1; color: #FFFFFF;">Leads</span>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; height: 50px; padding: 0 16px; border-radius: 17px; background: #0E0F12; border: 1px solid rgba(255,255,255,0.10);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.9" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="font-size: 15px; color: #55504B;">Name or phone</span>
    </div>

    <!-- The filter row scrolls INSIDE its own clipped track. This is the
         construct that was widening the page: a scroller needs min-width:0
         as well as overflow-x, or its content still sets the page width. -->
    <div style="display: flex; gap: 8px; overflow-x: auto; min-width: 0; margin: 0 -20px; padding: 0 20px; scrollbar-width: none;">
      <span style="display: flex; align-items: center; height: 44px; padding: 0 17px; border-radius: 14px; background: rgba(255,255,255,0.11); border: 1px solid rgba(255,255,255,0.16); font-size: 13.5px; font-weight: 700; color: #FFFFFF; white-space: nowrap; flex-shrink: 0;">All clients</span>
      <span style="display: flex; align-items: center; height: 44px; padding: 0 17px; border-radius: 14px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); font-size: 13.5px; color: #A8A29C; white-space: nowrap; flex-shrink: 0;">Escalated</span>
      <span style="display: flex; align-items: center; height: 44px; padding: 0 17px; border-radius: 14px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); font-size: 13.5px; color: #A8A29C; white-space: nowrap; flex-shrink: 0;">Qualified</span>
      <span style="display: flex; align-items: center; height: 44px; padding: 0 17px; border-radius: 14px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); font-size: 13.5px; color: #A8A29C; white-space: nowrap; flex-shrink: 0;">Viewing booked</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{leads}}" as="lead" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-radius: 20px; background: #0E0F12; border: 1px solid rgba(255,255,255,0.07);">
          <span style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 14px; background: {{lead.avBg}}; font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; color: {{lead.avInk}}; flex-shrink: 0;">{{lead.initial}}</span>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 15.5px; font-weight: 600; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{lead.name}}</span>
            <span style="font-size: 12.5px; color: #6E6863; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{lead.client}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0;">
            <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; line-height: 1; color: #F2F0EE;">{{lead.budget}}</span>
            <span style="padding: 3px 9px; border-radius: 8px; background: {{lead.stageBg}}; font-size: 10.5px; font-weight: 600; color: {{lead.stageInk}}; white-space: nowrap;">{{lead.stage}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: stretch; gap: 4px; padding: 10px 14px 30px 14px; background: rgba(8,8,10,0.92); border-top: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Queue</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px; border-radius: 18px; background: linear-gradient(140deg, rgba(232,69,60,0.26), rgba(122,26,22,0.20)); border: 1px solid rgba(232,69,60,0.42);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #FF7A70;">Leads</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Report</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">More</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      leads: [
        { initial: 'M', name: 'Manuel Vale', client: 'Ryvo Test Client', budget: '€900k',
          stage: 'viewing booked', avBg: 'rgba(237,228,220,0.12)', avInk: '#EDE4DC',
          stageBg: 'rgba(111,191,138,0.14)', stageInk: '#7FD0A0' },
        { initial: 'S', name: 'Sofia Marques', client: 'Atlântica Prime', budget: '€3.2M',
          stage: 'escalated', avBg: 'rgba(255,84,71,0.14)', avInk: '#FF8078',
          stageBg: 'rgba(255,84,71,0.14)', stageInk: '#FF8078' },
        { initial: 'H', name: 'Henrik Nilsson', client: 'Marbella Sur', budget: '€1.4M',
          stage: 'qualified', avBg: 'rgba(255,255,255,0.07)', avInk: '#C4BDB8',
          stageBg: 'rgba(255,255,255,0.06)', stageInk: '#A8A29C' },
        { initial: 'L', name: 'Lucía Fernández', client: 'Marbella Sur', budget: '€780k',
          stage: 'new', avBg: 'rgba(255,255,255,0.07)', avInk: '#C4BDB8',
          stageBg: 'rgba(255,255,255,0.06)', stageInk: '#A8A29C' },
      ],
    }
  }
}
</script>
</body>
</html>
