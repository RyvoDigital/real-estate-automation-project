<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #08080A; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C4BDB8; text-decoration: none; } a:hover { color: #F2F0EE; }
    * { box-sizing: border-box; min-width: 0; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #08080A; color: #F2F0EE; display: flex; flex-direction: column;">
  <div style="position: absolute; left: -60px; top: -80px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(232,69,60,0.30), transparent 68%); filter: blur(30px); pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 22px; padding: 60px 22px 0 22px; flex-grow: 1; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #6E6863;">Tuesday, 7 September</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: 1.06; color: #FFFFFF;">Five people<br>are waiting</span>
    </div>

    <!-- The queue's pressure as one typographic object, not a chart widget. -->
    <div style="display: flex; align-items: flex-end; gap: 14px; padding-bottom: 4px;">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #FF7A70;">Oldest</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 46px; line-height: 0.92; color: #FF5347;">4h 12m</span>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 4px; flex-grow: 1; height: 44px; min-width: 0;">
        <span style="flex: 1 1 0; height: 100%; border-radius: 4px; background: linear-gradient(180deg, #FF4438, #7A1A16);"></span>
        <span style="flex: 1 1 0; height: 48%; border-radius: 4px; background: rgba(224,102,90,0.55);"></span>
        <span style="flex: 1 1 0; height: 30%; border-radius: 4px; background: rgba(176,130,121,0.5);"></span>
        <span style="flex: 1 1 0; height: 20%; border-radius: 4px; background: rgba(142,132,128,0.45);"></span>
        <span style="flex: 1 1 0; height: 14%; border-radius: 4px; background: rgba(142,132,128,0.3);"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 11px; padding: 19px 20px; border-radius: 24px; background: {{row.bg}}; border: 1px solid {{row.border}};">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
            <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 23px; line-height: 1.1; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;">{{row.name}}</span>
            <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 25px; line-height: 1; color: {{row.tone}}; flex-shrink: 0;">{{row.age}}</span>
          </div>
          <span style="height: {{row.rule}}; border-radius: 3px; background: {{row.tone}};"></span>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <span style="font-size: 13px; color: #A8A29C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;">{{row.why}}</span>
            <span style="padding: 5px 11px; border-radius: 999px; background: {{row.chipBg}}; border: 1px solid {{row.chipBorder}}; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{row.chipInk}}; white-space: nowrap; flex-shrink: 0;">{{row.chip}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: stretch; gap: 4px; padding: 10px 14px 30px 14px; background: rgba(8,8,10,0.92); border-top: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px; border-radius: 18px; background: linear-gradient(140deg, rgba(232,69,60,0.26), rgba(122,26,22,0.20)); border: 1px solid rgba(232,69,60,0.42);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #FF7A70;">Queue</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Leads</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">Report</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1 1 0; min-height: 52px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6863" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #6E6863;">More</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { name: 'Sofia Marques', age: '4h 12m', why: 'Atlântica Prime · €3.2M', chip: 'High value', rule: '4px',
        bg: '#1F0F0D', border: 'rgba(255,84,71,0.34)', tone: '#FF5347',
        chipBg: 'rgba(237,228,220,0.13)', chipBorder: 'rgba(237,228,220,0.44)', chipInk: '#EDE4DC' },
      { name: 'Henrik Nilsson', age: '1h 48m', why: 'Asked for a person', chip: 'Person', rule: '3px',
        bg: '#171110', border: 'rgba(224,102,90,0.28)', tone: '#E0665A',
        chipBg: 'rgba(255,255,255,0.05)', chipBorder: 'rgba(255,255,255,0.15)', chipInk: '#A8A29C' },
      { name: 'Ana Ribeiro', age: '52m', why: 'Voice note — nothing to read', chip: 'System', rule: '2px',
        bg: '#111011', border: 'rgba(176,130,121,0.24)', tone: '#B08279',
        chipBg: 'rgba(255,84,71,0.13)', chipBorder: 'rgba(255,84,71,0.42)', chipInk: '#FF8078' },
    ] }
  }
}
</script>
</body>
</html>
